name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  test-real-world-mvrs:
    name: Test real-world MVRs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Cache real-world MVR files
        uses: actions/cache@v4
        with:
          path: tests/data/mvr/real-world/*.mvr
          key: real-world-mvrs-${{ hashFiles('tests/data/mvr/real-world/manifest.tsv') }}
      - name: Fetch real-world MVR files
        run: scripts/fetch-real-world-mvrs.sh
      - name: Run real-world MVR tests
        run: cargo test --verbose --test load_real_world_mvr -- --ignored
